[package]
name = "takt-student"
version = "0.1.0"
description = "Takt for students: the current lesson, its goals and materials"
edition = "2021"

[lib]
name = "takt_student_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# generate_context! embeds the plugins' config as serde_json values.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
